<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Screenshots — Sunscreen for Apple Watch</title>
<meta name="theme-color" content="#0A0B16">
<link rel="icon" href="../assets/icon.png">
<style>
  html, body { margin: 0; background: #0A0B16; }
  body { background: radial-gradient(52rem 26rem at 50% -8rem, rgba(59, 74, 138, 0.55), transparent 70%) no-repeat, #0A0B16; }
  main { padding: 48px 16px; }
  main img { display: block; width: 422px; max-width: 100%; height: auto; margin: 0 auto 48px; }
  main img:last-child { margin-bottom: 0; }
  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 56px 16px 0;
    font: 600 32px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #FFCD52;
    text-align: center;
  }
  header img { display: block; flex: none; width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 0 40px rgba(240, 161, 112, 0.35); }
  @media (max-width: 520px) {
    header { flex-direction: column; gap: 14px; padding-top: 40px; font-size: 24px; }
    header img { width: 64px; height: 64px; border-radius: 14px; }
  }
  @media (max-width: 360px) {
    header { font-size: 20px; }
  }
</style>
</head>
<body>
<header>
  <img src="icon.png" alt="">
  <span>Sunscreen for Apple Watch</span>
</header>
<main>
  <img src="1.png" width="422" height="514" alt="Sunscreen screenshot 1">
  <img src="2.png" width="422" height="514" alt="Sunscreen screenshot 2">
  <img src="3.png" width="422" height="514" alt="Sunscreen screenshot 3">
  <img src="4.png" width="422" height="514" alt="Sunscreen screenshot 4">
  <img src="5.png" width="422" height="514" alt="Sunscreen screenshot 5">
</main>
</body>
</html>
